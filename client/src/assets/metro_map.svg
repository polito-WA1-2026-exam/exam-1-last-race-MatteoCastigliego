<svg viewBox="0 0 910 590" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="910" height="590" fill="#0c0c0c"/>

  <!-- Subtle grid -->
  <line x1="0" y1="148" x2="910" y2="148" stroke="#161616" stroke-width="0.8" stroke-dasharray="4,12"/>
  <line x1="0" y1="295" x2="910" y2="295" stroke="#1a1a1a" stroke-width="0.8" stroke-dasharray="4,12"/>
  <line x1="0" y1="443" x2="910" y2="443" stroke="#161616" stroke-width="0.8" stroke-dasharray="4,12"/>
  <line x1="152" y1="0" x2="152" y2="590" stroke="#161616" stroke-width="0.8" stroke-dasharray="4,12"/>
  <line x1="304" y1="0" x2="304" y2="590" stroke="#161616" stroke-width="0.8" stroke-dasharray="4,12"/>
  <line x1="456" y1="0" x2="456" y2="590" stroke="#161616" stroke-width="0.8" stroke-dasharray="4,12"/>
  <line x1="608" y1="0" x2="608" y2="590" stroke="#161616" stroke-width="0.8" stroke-dasharray="4,12"/>
  <line x1="760" y1="0" x2="760" y2="590" stroke="#161616" stroke-width="0.8" stroke-dasharray="4,12"/>

  <!-- F1 red stripe + border -->
  <rect x="3" y="3" width="904" height="4" fill="#dc0000" opacity="0.8" rx="2"/>
  <rect x="3" y="3" width="904" height="584" fill="none" stroke="#dc0000" stroke-width="1" stroke-opacity="0.25" rx="3"/>

  <text x="455" y="34" text-anchor="middle" fill="white" font-size="16" font-weight="700" letter-spacing="2">LAST RACE — Corners Network</text>

  <!-- M3 Green — drawn first so M5 crosses over it -->
  <path d="M 380,295
           C 448,268 572,365 685,435
           C 732,458 762,476 795,496
           C 835,520 858,534 878,548"
        fill="none" stroke="#0c1a0c" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 380,295
           C 448,268 572,365 685,435
           C 732,458 762,476 795,496
           C 835,520 858,534 878,548"
        fill="none" stroke="#2ecc71" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- M4 Yellow — Interlagos hairpin: tight curve along the bottom -->
  <path d="M 685,435
           C 648,455 605,466 548,468
           C 492,470 440,472 390,474
           C 346,476 308,478 270,480"
        fill="none" stroke="#1a1500" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 685,435
           C 648,455 605,466 548,468
           C 492,470 440,472 390,474
           C 346,476 308,478 270,480"
        fill="none" stroke="#f1c40f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- M1 Red — Monaco chicane: S-curve into Porta Susa -->
  <path d="M 72,85
           C 115,60  162,190  182,152
           C 205,112  252,238  315,252
           C 344,260  365,278  380,295"
        fill="none" stroke="#1a0000" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 72,85
           C 115,60  162,190  182,152
           C 205,112  252,238  315,252
           C 344,260  365,278  380,295"
        fill="none" stroke="#e74c3c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- M2 Blue — Eau Rouge: dips DOWN then sweeps hard UP to Vinzaglio -->
  <path d="M 72,295
           C 185,296  300,296  380,295
           C 402,358  528,100  660,155
           C 706,196  752,242  800,270
           C 838,252  860,230  878,208"
        fill="none" stroke="#00061a" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 72,295
           C 185,296  300,296  380,295
           C 402,358  528,100  660,155
           C 706,196  752,242  800,270
           C 838,252  860,230  878,208"
        fill="none" stroke="#3498db" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- M5 Purple — Suzuka sweep: arcs down-left and CROSSES M3 -->
  <path d="M 660,155
           C 632,205  590,255  548,295
           C 514,328  474,362  428,395
           C 374,432  322,458  270,480
           C 228,502  188,525  148,548"
        fill="none" stroke="#0a001a" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 660,155
           C 632,205  590,255  548,295
           C 514,328  474,362  428,395
           C 374,432  322,458  270,480
           C 228,502  188,525  148,548"
        fill="none" stroke="#9b59b6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- M4 Yellow extension — Lingotto up to Massaua (crosses M2 blue) -->
  <path d="M 270,480 C 255,390 220,290 182,152"
        fill="none" stroke="#1a1500" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 270,480 C 255,390 220,290 182,152"
        fill="none" stroke="#f1c40f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- M1 stations -->
  <circle cx="72" cy="85" r="6" fill="white" stroke="#e74c3c" stroke-width="2.5"/>
  <text x="50" y="75" text-anchor="middle" fill="#e5e7eb" font-size="10" stroke="#0c0c0c" stroke-width="3" paint-order="stroke">Sainte Dévote</text>

  <circle cx="315" cy="252" r="6" fill="white" stroke="#e74c3c" stroke-width="2.5"/>
  <text x="290" y="242" text-anchor="middle" fill="#e5e7eb" font-size="10" stroke="#0c0c0c" stroke-width="3" paint-order="stroke">Wall of Champions</text>

  <!-- M2 stations -->
  <circle cx="72" cy="295" r="6" fill="white" stroke="#3498db" stroke-width="2.5"/>
  <text x="72" y="282" text-anchor="middle" fill="#e5e7eb" font-size="10" stroke="#0c0c0c" stroke-width="3" paint-order="stroke">Rascasse</text>

  <circle cx="800" cy="270" r="6" fill="white" stroke="#3498db" stroke-width="2.5"/>
  <text x="800" y="257" text-anchor="middle" fill="#e5e7eb" font-size="10" stroke="#0c0c0c" stroke-width="3" paint-order="stroke">Becketts</text>

  <circle cx="878" cy="208" r="6" fill="white" stroke="#3498db" stroke-width="2.5"/>
  <text x="878" y="195" text-anchor="middle" fill="#e5e7eb" font-size="10" stroke="#0c0c0c" stroke-width="3" paint-order="stroke">Ascari</text>

  <!-- M3 stations -->
  <circle cx="795" cy="496" r="6" fill="white" stroke="#2ecc71" stroke-width="2.5"/>
  <text x="820" y="500" text-anchor="start" fill="#e5e7eb" font-size="10" stroke="#0c0c0c" stroke-width="3" paint-order="stroke">Variante Alta</text>

  <circle cx="878" cy="548" r="6" fill="white" stroke="#2ecc71" stroke-width="2.5"/>
  <text x="878" y="562" text-anchor="middle" fill="#e5e7eb" font-size="10" stroke="#0c0c0c" stroke-width="3" paint-order="stroke">Casinò</text>

  <!-- M4 stations -->
  <circle cx="548" cy="468" r="6" fill="white" stroke="#f1c40f" stroke-width="2.5"/>
  <text x="548" y="455" text-anchor="middle" fill="#e5e7eb" font-size="10" stroke="#0c0c0c" stroke-width="3" paint-order="stroke">Lesmo 2</text>

  <circle cx="390" cy="474" r="6" fill="white" stroke="#f1c40f" stroke-width="2.5"/>
  <text x="390" y="461" text-anchor="middle" fill="#e5e7eb" font-size="10" stroke="#0c0c0c" stroke-width="3" paint-order="stroke">Lesmo 1</text>

  <!-- M5 stations -->
  <circle cx="548" cy="295" r="6" fill="white" stroke="#9b59b6" stroke-width="2.5"/>
  <text x="548" y="282" text-anchor="middle" fill="#e5e7eb" font-size="10" stroke="#0c0c0c" stroke-width="3" paint-order="stroke">130R</text>

  <circle cx="428" cy="395" r="6" fill="white" stroke="#9b59b6" stroke-width="2.5"/>
  <text x="403" y="399" text-anchor="end" fill="#e5e7eb" font-size="10" stroke="#0c0c0c" stroke-width="3" paint-order="stroke">Tamburello</text>

  <circle cx="148" cy="548" r="6" fill="white" stroke="#9b59b6" stroke-width="2.5"/>
  <text x="148" y="562" text-anchor="middle" fill="#e5e7eb" font-size="10" stroke="#0c0c0c" stroke-width="3" paint-order="stroke">Copse</text>

  <!-- Mirabeau interchange M1+M4 -->
  <circle cx="182" cy="152" r="13" fill="#0c0c0c" stroke="white" stroke-width="3"/>
  <circle cx="182" cy="152" r="5" fill="white"/>
  <text x="182" y="135" text-anchor="middle" fill="#f1c40f" font-size="8" letter-spacing="1">M1·M4</text>
  <text x="182" y="126" text-anchor="middle" fill="white" font-size="10" font-weight="700" stroke="#0c0c0c" stroke-width="3" paint-order="stroke">Mirabeau</text>

  <!-- ══ INTERCHANGE STATIONS — bull's-eye on top ══ -->

  <!-- Eau Rouge triple -->
  <circle cx="380" cy="295" r="16" fill="#0c0c0c" stroke="white" stroke-width="3.5"/>
  <circle cx="380" cy="295" r="7" fill="white"/>
  <text x="380" y="272" text-anchor="middle" fill="#f1c40f" font-size="8" letter-spacing="1">M1·M2·M3</text>
  <text x="380" y="283" text-anchor="middle" fill="white" font-size="10" font-weight="700" stroke="#0c0c0c" stroke-width="3" paint-order="stroke">Eau Rouge</text>

  <!-- Raidillon double -->
  <circle cx="660" cy="155" r="13" fill="#0c0c0c" stroke="white" stroke-width="3"/>
  <circle cx="660" cy="155" r="5" fill="white"/>
  <text x="660" y="141" text-anchor="middle" fill="white" font-size="10" font-weight="700" stroke="#0c0c0c" stroke-width="3" paint-order="stroke">Raidillon</text>

  <!-- Parabolica double -->
  <circle cx="685" cy="435" r="13" fill="#0c0c0c" stroke="white" stroke-width="3"/>
  <circle cx="685" cy="435" r="5" fill="white"/>
  <text x="710" y="439" text-anchor="start" fill="white" font-size="10" font-weight="700" stroke="#0c0c0c" stroke-width="3" paint-order="stroke">Parabolica</text>

  <!-- Stone double -->
  <circle cx="270" cy="480" r="13" fill="#0c0c0c" stroke="white" stroke-width="3"/>
  <circle cx="270" cy="480" r="5" fill="white"/>
  <text x="245" y="484" text-anchor="end" fill="white" font-size="10" font-weight="700" stroke="#0c0c0c" stroke-width="3" paint-order="stroke">Stone</text>
</svg>
